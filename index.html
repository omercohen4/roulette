<style>
/* One-column phone app on blue casino felt: glass HUD bars, gold actions, Bodoni numerals. */
:root{
  --bg:#050E2B; --felt:#1D4CB0; --felt-hi:#3A7BEA; --felt-deep:#0C2463; --cell:#1A4AA6;
  --gold:#E2BE6A; --gold-hi:#F5DB98; --gold-lo:#A7802F; --ink:#1A1206;
  --ivory:#F6EFDC; --muted:#B9C9F0; --soft:#D6E1FA;
  --red-hi:#D3202A; --red-lo:#9A0E15; --blk-hi:#2A2A2F; --blk-lo:#0E0E10; --grn-hi:#13A257; --grn-lo:#0B7A40;
  --win:#8FE0AE; --lose:#F29A9F;
  --glass:rgba(6,14,48,.6); --glass-line:rgba(226,190,106,.3); --hair:rgba(185,201,240,.22);
  --display:'Bodoni Moda',Georgia,'Times New Roman',serif;
  --ui:'Sora',system-ui,-apple-system,sans-serif;
  --row:30px;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
body{height:100%}
body{background:url("assets/felt.svg"),radial-gradient(ellipse 120% 70% at 50% 18%,var(--felt-hi) 0%,var(--felt) 45%,var(--felt-deep) 75%,var(--bg) 100%) fixed;background-color:var(--bg);color:var(--ivory);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;box-sizing:border-box;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 22px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.h1{margin:0;font-family:var(--display);font-weight:900;font-size:30px;line-height:1.05;text-wrap:balance}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill-btn{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--glass-line);background:var(--glass);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.gold{border:none;border-radius:30px;min-height:56px;background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 28px rgba(226,190,106,.35);color:var(--ink);font-size:16px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px}
.gold:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed}
.ghost{border:1px solid rgba(226,190,106,.6);border-radius:28px;min-height:50px;background:transparent;color:var(--gold-hi);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 18px}
.lang{height:40px;padding:0 4px;border-radius:20px;border:1px solid var(--glass-line);background:var(--glass);display:flex;gap:2px;align-items:center;font-size:12px;font-weight:600;flex:none}
.lang span{padding:8px 10px;border-radius:16px}
.lang span.on{background:var(--gold);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.input{height:54px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:2px solid rgba(185,201,240,.35);background:var(--glass);font-size:17px;font-weight:600;outline:none;width:100%}
.input:focus{border-color:var(--gold)}
.pin-input{letter-spacing:.8em;font-family:var(--display);font-size:22px;text-align:center}
.err{min-height:18px;font-size:13px;color:var(--lose)}
.card{border-radius:18px;background:var(--glass);border:1px solid var(--hair);padding:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:#0A1640;border:1px solid var(--glass-line);border-radius:22px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 48px)}
.notice{font-size:12px;color:var(--muted);text-align:center}

/* avatars, lists, podium */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0A1230;flex:none}
.tabs{display:flex;gap:6px;padding:4px;border-radius:22px;background:var(--glass);border:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;min-width:92px;height:38px;border-radius:18px;border:none;background:none;font-size:13px;font-weight:600;padding:0 12px;white-space:nowrap}
.tabs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.tabs button.add{flex:0 0 46px;min-width:46px;border:1px dashed rgba(185,201,240,.4)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.pod{width:31%;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .base{align-self:stretch;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.list{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 14px;border-radius:16px;border:1px solid var(--hair);background:rgba(6,14,48,.5);text-align:start;width:100%}
.prow.me{border:2px solid var(--gold)}
.prow .rk{width:22px;font-family:var(--display);font-size:16px;font-weight:700}
.prow .nm{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .note{font-size:11px;color:var(--muted)}
.grp-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(255,122,168,.22),rgba(110,75,216,.22));border:1px solid rgba(255,255,255,.16)}

/* keypad */
.dots{display:flex;gap:18px;justify-content:center}
.dots span{width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:2px solid rgba(185,201,240,.5)}
.dots span.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(226,190,106,.7)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;justify-content:center}
.key{width:76px;height:76px;border-radius:50%;border:1px solid rgba(185,201,240,.25);background:rgba(255,255,255,.07);font:500 30px var(--display);font-variant-numeric:lining-nums;display:flex;align-items:center;justify-content:center;padding:0}
.key.plain{background:none;border:none}

/* table */
.hud{display:flex;align-items:center;height:44px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);flex:1;min-width:0}
.hud>div{flex:1;display:flex;flex-direction:column;align-items:center}
.hud .lb{font-size:10px;letter-spacing:.16em;color:var(--muted)}
.hud .vl{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:lining-nums}
.hud .sep{flex:0 0 1px;height:24px;background:var(--glass-line)}
.hist{display:flex;gap:4px;flex-wrap:wrap}
.hb{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;box-shadow:0 0 0 1.5px rgba(246,239,220,.4)}
.hb:first-child{box-shadow:0 0 0 1.5px var(--gold)}
.c-red{background:linear-gradient(180deg,var(--red-hi),var(--red-lo))}
.c-black{background:linear-gradient(180deg,var(--blk-hi),var(--blk-lo))}
.c-green{background:linear-gradient(180deg,var(--grn-hi),var(--grn-lo))}
.felt-cell{background:url("assets/felt.svg"),var(--cell)}
.board{display:flex;flex-direction:column;gap:1.5px;padding:1.5px;background:rgba(246,239,220,.75);border-radius:6px;box-shadow:0 18px 30px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board button{border:none;padding:0;position:relative;color:var(--ivory)}
.b-top,.b-bot,.b-mid{display:flex;gap:1.5px}
.b-side{width:91.5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.14em;color:var(--soft)}
.zero{flex:1;height:calc(var(--row) + 4px);font:700 18px var(--display)!important;border-radius:4px 4px 0 0}
.dozcol{width:40px;flex:none;display:flex;flex-direction:column;gap:1.5px}
.dozcol button{height:calc(var(--row) * 4 + 4.5px);font-size:11px;font-weight:600;letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg)}
.evcol{width:50px;flex:none;display:flex;flex-direction:column;gap:1.5px}
.evcol button{height:calc(var(--row) * 2 + 1.5px);font-size:11px;font-weight:700;letter-spacing:.04em}
.gridwrap{flex:1;position:relative;cursor:pointer}
.numgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:var(--row);gap:1.5px}
.numgrid div{display:flex;align-items:center;justify-content:center;font:700 16px var(--display);font-variant-numeric:lining-nums}
.numgrid div.hit{box-shadow:0 0 0 2px var(--gold-hi) inset}
.chiplayer{position:absolute;inset:0;pointer-events:none}
.colrow{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5px}
.colrow button{height:var(--row);font-size:12px;font-weight:600}
.chip{position:relative;border-radius:50%;background:radial-gradient(circle,var(--c) 0 50%,transparent 51%),repeating-conic-gradient(var(--s,#F6EFDC) 0 11deg,var(--c) 11deg 45deg);box-shadow:0 2px 0 var(--d),0 5px 10px rgba(0,0,0,.55);flex:none}
.chip>span{position:absolute;inset:18%;border-radius:50%;border:1.5px dashed rgba(246,239,220,.75);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--t,#F6EFDC);font-family:'Sora',system-ui,sans-serif}
.bchip{--cs:min(24px,calc(var(--row) - 6px));position:absolute;width:var(--cs);height:var(--cs);margin:calc(var(--cs) / -2) 0 0 calc(var(--cs) / -2);z-index:2;pointer-events:none}
.bchip>span{inset:14%;border-width:1px;font-size:8px}
.in-btn{left:50%;top:50%}
.rack{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px}
.rack .chip{width:50px;height:50px;border:none;padding:0;transition:transform .15s}
.rack .chip>span{font-size:12px}
.rack .chip.on{transform:translateY(-10px);outline:2px solid var(--gold);outline-offset:3px}
.hint{align-self:center;display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 12px;box-sizing:border-box;border-radius:15px;background:rgba(226,190,106,.16);border:1px solid rgba(226,190,106,.4);font-size:12px;color:var(--gold-hi);text-align:center}

/* overlays and wheels */
.overlay{position:fixed;inset:0;z-index:30;background:url("assets/felt.svg"),radial-gradient(circle at 50% 38%,#2B66D4 0%,#143D92 40%,#071742 75%,#02081C 100%);background-color:#02081C;overflow-y:auto}
.overlay .app{min-height:100%;height:100%;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.overlay .screen{min-height:0}
.wheelbox{position:relative;align-self:center;width:min(300px,78vw);aspect-ratio:1;max-width:100%}
.wheelbox img,.w-rotor img{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.ballarm{position:absolute;inset:0}
.ball{position:absolute;left:50%;top:50%;width:3.8%;height:3.8%;margin:-1.9% 0 0 -1.9%;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0,#f4f4f2 18%,#cfcfcb 52%,#8d8d88 82%,#5f5f5b 100%);box-shadow:1px 3px 4px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.25)}

.rays{position:absolute;left:50%;top:30%;width:800px;height:800px;margin:-400px 0 0 -400px;border-radius:50%;background:repeating-conic-gradient(rgba(226,190,106,.1) 0 6deg,rgba(226,190,106,0) 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);pointer-events:none}
.banner{display:flex;align-items:center;gap:14px;justify-content:center;font-size:13px;font-weight:600;letter-spacing:.4em;color:var(--gold)}
.banner::before,.banner::after{content:"";width:44px;height:1px;background:var(--gold);opacity:.7}
.lines{flex:0 1 auto;min-height:0;overflow-y:auto;border-radius:16px;background:var(--glass);border:1px solid rgba(226,190,106,.25)}

.prize-rot{position:absolute;inset:0;border-radius:50%}
.plabel{position:absolute;left:50%;top:50%;width:60px;height:20px;margin:-10px 0 0 -30px;display:flex;align-items:center;justify-content:center;font-weight:700}

.odds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.odds div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px}
.adbox{flex:1;min-height:320px;border-radius:20px;border:1px dashed rgba(185,201,240,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(6,14,48,.5)}
.ticket{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(150deg,#FF7AA8 0%,#8A4BD8 55%,#2F3FB0 100%);padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ticket::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.14) 0 10deg,rgba(255,255,255,0) 10deg 20deg)}
.linkbox{display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 6px 6px 16px;box-sizing:border-box;border-radius:14px;background:var(--glass);border:1px solid rgba(185,201,240,.3)}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--soft);user-select:all}
.welcome{align-items:center;justify-content:center;text-align:center;gap:22px;overflow:hidden}
.wel-wheel{position:relative;width:min(320px,78vw,44vh);aspect-ratio:1}
.wel-wheel img{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.wel-wheel .w-rotor{animation:idle 40s linear infinite}
.wel-glow{position:absolute;inset:-6%;border-radius:50%;box-shadow:0 0 0 2px rgba(226,190,106,.45),0 0 80px rgba(120,190,255,.6),0 30px 60px rgba(0,0,0,.6)}

@keyframes idle{to{transform:rotate(360deg)}}
#app.lock{height:100%;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

// The table screen must fit the phone without scrolling: shrink the board rows, then the side wheel.
function fitTable() {
  if (S.view !== 'table') return;
  var root = document.documentElement, img = $('tablewheel');
  root.style.setProperty('--row', '30px');
  if (img) { img.style.width = img.style.height = '84px'; }
  var row = 30, wheel = 84;
  for (var i = 0; i < 8; i++) {
    var over = root.scrollHeight - window.innerHeight;
    if (over <= 0) break;
    if (row > 20) { row = Math.max(20, row - Math.max(1, Math.ceil(over / 12))); root.style.setProperty('--row', row + 'px'); }
    else if (img && wheel > 52) { wheel = Math.max(52, wheel - over); img.style.width = img.style.height = wheel + 'px'; }
    else break;
  }
}

// ---------- bets ----------
function numAt(r, c) { return r * 3 + c + 1; }
function betInfo(key) {
  var parts = key.split(':'), k = parts[0], a = parts[1];
  var nums = [], anchor = null, label = '';
  var rc = function (n) { return [(n - 1) / 3 | 0, (n - 1) % 3]; };
  if (k === 'n') { var n = +a; nums = [n]; label = t('b_straight', {a: n}); if (n > 0) { var p = rc(n); anchor = [p[1] + .5, p[0] + .5]; } }
  else if (k === 'sh') { var n1 = +a, q = rc(n1); nums = [n1, n1 + 1]; anchor = [q[1] + 1, q[0] + .5]; label = t('b_split', {a: n1 + '/' + (n1 + 1)}); }
  else if (k === 'sv') { var n2 = +a, q2 = rc(n2); nums = [n2, n2 + 3]; anchor = [q2[1] + .5, q2[0] + 1]; label = t('b_split', {a: n2 + '/' + (n2 + 3)}); }
  else if (k === 'sz') { var n3 = +a; nums = [0, n3]; anchor = [n3 - .5, 0]; label = t('b_split', {a: '0/' + n3}); }
  else if (k === 'tr') { var n4 = +a; nums = n4 === 1 ? [0, 1, 2] : [0, 2, 3]; anchor = [n4 === 1 ? 1 : 2, 0]; label = t('b_trio', {a: nums.join('-')}); }
  else if (k === 'ff') { nums = [0, 1, 2, 3]; anchor = [0, 0]; label = t('b_four'); }
  else if (k === 'st') { var r = +a; nums = [numAt(r, 0), numAt(r, 1), numAt(r, 2)]; anchor = [3, r + .5]; label = t('b_street', {a: nums[0] + '–' + nums[2]}); }
  else if (k === 'sl') { var r2 = +a; nums = []; for (var i = 0; i < 6; i++) nums.push(numAt(r2, 0) + i); anchor = [3, r2 + 1]; label = t('b_line', {a: nums[0] + '–' + nums[5]}); }
  else if (k === 'co') { var n5 = +a, q3 = rc(n5); nums = [n5, n5 + 1, n5 + 3, n5 + 4]; anchor = [q3[1] + 1, q3[0] + 1]; label = t('b_corner', {a: nums.join('-')}); }
  else if (k === 'col') { var c = +a; for (var j = 0; j < 12; j++) nums.push(numAt(j, c)); label = t('b_col', {a: c + 1}); }

function watchAd() {
  var p = me(); if (!p || !luckyLeft(p)) return;
  var secs = 5;
  var h = '<div class="overlay"><div class="app"><div class="screen"><div class="row"><span class="eyebrow grow">' + t('ad') + '</span><span class="pill-btn" id="adcount" style="height:36px">' + secs + '</span></div>';
  h += '<div class="adbox"><span class="eyebrow">' + t('ad_space') + '</span><span class="num" style="font-size:28px;font-weight:900">300 × 250</span></div>';
  h += '<p class="notice" id="adtext">' + t('ad_wait', {s: secs}) + '</p><button class="gold" id="adgo" data-act="adgo" disabled>' + t('continue') + '</button></div></div></div>';
  $('layer').innerHTML = h;
  var timer = setInterval(function () {
    secs--;
    var c = $('adcount'), tx = $('adtext'), b = $('adgo');
    if (!c) { clearInterval(timer); return; }
    c.textContent = Math.max(secs, 0);
    tx.textContent = secs > 0 ? t('ad_wait', {s: secs}) : t('ad_done');
    if (secs <= 0) { clearInterval(timer); b.disabled = false; }
  }, 1000);
}
var luckyAngle = 0, luckyPrize = null;
function viewLucky() {
  var p = me(); if (!p) { S.view = 'board'; return viewBoard(); }
  var labels = PRIZE_SLICES.map(function (s) {
    var mid = (s[1] + s[2]) / 2, none = s[0] === 0;
    return '<span class="plabel" style="transform:rotate(' + mid + 'deg) translateY(calc(var(--lw) * -' + (none ? 0.347 : 0.367) + '));font-family:' + (none ? 'var(--ui)' : 'var(--display)') + ';font-size:' + (none ? 10 : (s[0] === 5 ? 17 : 20)) + 'px;color:' + (s[0] === 5 ? '#1A1206' : (none ? 'var(--soft)' : 'var(--ivory)')) + '">' + (none ? esc(t('no_win_lbl')) : '$' + s[0]) + '</span>';
  }).join('');
  var h = '<div class="screen" style="align-items:center"><div class="rays" style="position:fixed"></div>';
  h += '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;position:relative"><span class="eyebrow" style="color:var(--gold-hi);letter-spacing:.32em">' + t('lucky') + '</span><span class="small muted">' + t('spins_left', {n: luckyLeft(p)}) + '</span></div>';
  h += '<div class="wheelbox" id="luckybox" style="margin-top:14px;--lw:min(300px,80vw,38vh);width:var(--lw)"><div style="position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,var(--gold-hi),var(--gold-lo));box-shadow:0 0 60px rgba(226,190,106,.5),0 24px 40px rgba(0,0,0,.6)"></div>';
  h += '<div class="prize-rot" id="luckyrot" style="transform:rotate(' + luckyAngle + 'deg)"><div class="prize"></div>' + labels + '</div><span class="hub"></span><div class="pointer" style="border-top-color:var(--ivory)"></div></div>';
  h += '<div id="luckyres" style="display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;position:relative;margin-top:8px"></div>';
  h += '<div class="card" style="align-self:stretch;display:flex;flex-direction:column;gap:8px;position:relative"><div class="row" style="justify-content:space-between"><span class="eyebrow">' + t('odds') + '</span><span class="small muted">' + t('slice') + '</span></div><div class="odds">';
  var oc = {0: ['#2A3558', 'var(--soft)'], 1: ['#2F86D6', 'var(--ivory)'], 2: ['#1A9C8A', 'var(--ivory)'], 3: ['#6E4BD8', 'var(--ivory)'], 5: ['#E2BE6A', '#1A1206']};
  h += PRIZE_WEIGHTS.map(function (w) { return '<div style="background:' + oc[w[0]][0] + ';color:' + oc[w[0]][1] + '"><span class="num" style="font-size:16px">' + (w[0] ? '$' + w[0] : '—') + '</span><span style="font-size:12px;font-weight:600">' + w[1] + '%</span></div>'; }).join('');
  h += '</div></div><div id="luckyact" style="align-self:stretch;margin-top:auto;display:flex;flex-direction:column;gap:10px;position:relative"><button class="gold" data-act="luckyspin">' + t('spin_wheel') + '</button></div></div>';
  return h;
}
async function luckySpin() {
  var p = me(); if (!p || S.spinning || !luckyLeft(p)) return;
  S.spinning = true;
  var btn = document.querySelector('[data-act="luckyspin"]'); if (btn) btn.disabled = true;
  var roll = rand(100), acc = 0, prize = 0;
  for (var i = 0; i < PRIZE_WEIGHTS.length; i++) { acc += PRIZE_WEIGHTS[i][1]; if (roll < acc) { prize = PRIZE_WEIGHTS[i][0]; break; } }
  var options = PRIZE_SLICES.filter(function (s) { return s[0] === prize; });
  var sl = options[rand(options.length)];
  var mid = sl[1] + 4 + Math.random() * (sl[2] - sl[1] - 8);
  var target = -mid, delta = ((target - luckyAngle) % 360 + 360) % 360;
  var end = luckyAngle + 360 * 5 + delta;
  var rot = $('luckyrot'), dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 400 : 4200;
  try { rot.animate([{transform: 'rotate(' + luckyAngle + 'deg)'}, {transform: 'rotate(' + end + 'deg)'}], {duration: dur, easing: 'cubic-bezier(.1,.7,.15,1)', fill: 'forwards'}); } catch (e) { rot.style.transform = 'rotate(' + end + 'deg)'; }
  luckyAngle = end % 360;
  Sound.ticks(dur / 1000 * 0.92);
  var used = p.luckyDay === todayStr() ? (p.luckyUsed || 0) + 1 : 1;
  setTimeout(async function () {
    var newBal = (p.balance || 0) + prize;
    try { await Store.patchPlayer(p.id, {balance: newBal, luckyDay: todayStr(), luckyUsed: used}); } catch (e) { toast(t('err_save')); }
    S.spinning = false;
    var res = $('luckyres'), act = $('luckyact');
    if (prize) Sound.win(prize === 5); else Sound.lose();
    if (res) res.innerHTML = prize ? '<span class="eyebrow" style="color:var(--gold);letter-spacing:.3em">' + t('you_won') + '</span><span class="num" style="font-size:52px;font-weight:900;line-height:1;color:var(--gold-hi);text-shadow:0 0 28px rgba(226,190,106,.55)">$' + prize + '</span>' : '<span class="num" style="font-size:28px;font-weight:900;color:var(--muted);margin-top:16px">' + t('nothing') + '</span>';
    var left = LUCKY_PER_DAY - used;
    if (act) {
      if (newBal >= 1) act.innerHTML = '<button class="gold" data-act="totable">' + esc(t('back_table', {v: newBal})) + '</button>';
      else if (left > 0) act.innerHTML = '<button class="gold" data-act="watchad">' + ICON.play + t('another') + '</button><p class="notice">' + t('spins_left', {n: left}) + '</p>';
      else act.innerHTML = '<p class="notice">' + t('come_back') + '</p><button class="ghost" data-act="home">' + t('board') + '</button>';
    }
  }, dur + 200);
}

// ---------- events ----------
function boardRise() {
  var b = document.querySelector('.board');
  if (b) { try { b.animate([{transform: 'translateY(35%) scale(.8)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)'}); } catch (e) {} }
}
document.addEventListener('click', function (ev) {
  Sound.init();
  var grid = ev.target.closest && ev.target.closest('#gridwrap');
  if (grid) {
    var r = grid.getBoundingClientRect();
    placeBet(keyFromPoint((ev.clientX - r.left) / r.width * 3, (ev.clientY - r.top) / r.height * 12));
    return;
  }
  var betBtn = ev.target.closest && ev.target.closest('[data-bet]');
  if (betBtn) { placeBet(betBtn.getAttribute('data-bet')); return; }
  var el = ev.target.closest && ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'chip') Sound.chip(); else if (act !== 'spin' && act !== 'rebet' && act !== 'luckyspin' && act !== 'enter') Sound.tap();
  if (act === 'enter') { enterCasino(); return; }
  if (act === 'sound') { Sound.on = !Sound.on; lsSet('rl.sound', Sound.on ? 'on' : 'off'); render(); if (Sound.on) Sound.tap(); return; }
  if (act === 'tab') { closeLayer(); go('board', {tab: el.getAttribute('data-tab')}); return; }
  if (act === 'home') { closeLayer(); S.pin = ''; go('board'); return; }
  if (act === 'pick') {
    var id = el.getAttribute('data-id');
    if (S.me === id) { if (S.pendingJoin) joinGroup(S.pendingJoin); else enterTable(); return; }
    go('login', {loginId: id, pin: ''}); return;
  }
  if (act === 'key') { pressKey(el.getAttribute('data-k')); return; }
  if (act === 'keydel') { S.pin = S.pin.slice(0, -1); render(); return; }
  if (act === 'newplayer') { go('newplayer'); return; }
  if (act === 'creategroup') { if (!me()) S.after = 'creategroup'; go('creategroup'); return; }
  if (act === 'invite') { go('invite', {inviteCode: el.getAttribute('data-code')}); return; }
  if (act === 'copy') {
    var link = $('invlink').textContent;
    var ok = function () { el.lastChild.textContent = t('copied'); };
    var fail = function () { var rg = document.createRange(); rg.selectNodeContents($('invlink')); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast(t('copy_fail')); };
    try { navigator.clipboard.writeText(link).then(ok, fail); } catch (e) { fail(); }
    return;
  }
  if (act === 'logout') { setSession(null); go('board'); return; }
  if (act === 'totable') { closeLayer(); enterTable(); return; }
  if (act === 'leave') { S.bets = {}; S.order = []; go('board'); return; }
  if (act === 'chip') { S.chip = +el.getAttribute('data-v'); render(); return; }
  if (act === 'undo') { var u = S.order.pop(); if (u) { S.bets[u[0]] -= u[1]; if (S.bets[u[0]] <= 0) delete S.bets[u[0]]; } updateHud(); paintChips(); return; }
  if (act === 'clear') { S.bets = {}; S.order = []; updateHud(); paintChips(); return; }
  if (act === 'double') {
    var p = me(); if (!p) return;
    if (totalBet() * 2 > (p.balance || 0)) { toast(t('no_money')); return; }
    Object.keys(S.bets).forEach(function (k) { S.order.push([k, S.bets[k]]); S.bets[k] *= 2; });
    updateHud(); paintChips(); return;
  }
  if (act === 'spin') { spin(false); return; }
  if (act === 'rebet') { closeLayer(); go('table'); spin(true); return; }
  if (act === 'newbets') { closeLayer(); go('table'); boardRise(); return; }
  if (act === 'tobroke') { closeLayer(); go('broke'); return; }
  if (act === 'watchad') { watchAd(); return; }
  if (act === 'adgo') { closeLayer(); go('lucky'); return; }
  if (act === 'luckyspin') { luckySpin(); return; }
});
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  if (ev.target.id === 'npform') createPlayer();
  if (ev.target.id === 'cgform') createGroup();
  if (ev.target.id === 'joinform') {
    var code = $('join-code').value;
    if (!me()) { S.pendingJoin = code.toUpperCase(); $('joinerr').textContent = t('login_first'); return; }
    joinGroup(code);
  }
});
document.addEventListener('input', function (ev) { if (ev.target.id === 'np-name') S.npName = ev.target.value; });

Store.subs.push(function () {
  // Live updates: redraw quiet screens, never mid-spin or while typing.
  if (S.spinning) return;
  if (S.view === 'board' || S.view === 'invite') render();
  if (S.view === 'login' && !Store.player(S.loginId)) go('board');
});
render();
Store.init().then(function () {
  if (S.me && !Store.player(S.me)) setSession(null);
  render();
});
})();
</script>
